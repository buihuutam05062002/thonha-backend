spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/thonha?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      timeout: 3s
      ssl:
        enabled: ${REDIS_SSL:false}

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 60MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:7}

#  otp:
#    ttl-minutes: ${OTP_TTL_MINUTES:5}
#    max-attempts: ${OTP_MAX_ATTEMPTS:5}
#    expose-in-response: ${OTP_EXPOSE_IN_RESPONSE:true}

  cloudinary:
    url: ${CLOUDINARY_URL}

  goong:
    api-key: ${GOONG_API_KEY}

  admin:
    email: ${ADMIN_EMAIL:admin@nhatho.com}
    password: ${ADMIN_PASSWORD:Admin@123}
    full-name: Administrator
    phone: ${ADMIN_PHONE:0900000000}

logging:
  level:
    org.springframework.security: INFO

sepay:
  bank-account: "0721074737777"
  bank-name: MBBank
  accountHolder: Bui Huu Tam
  api-key: ${SEPAY_API_KEY}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-flash-latest}
  fallback-models: ${GEMINI_FALLBACK_MODELS:}   # tên các model cách nhau bằng dấu phẩy
  base-url: https://generativelanguage.googleapis.com/v1beta
  timeout-seconds: 15
  min-confidence: 0.5